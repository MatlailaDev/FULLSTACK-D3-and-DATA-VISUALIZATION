<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Scatterplot</title>
    <script src="/d3/d3.v7.js" type="text/javascript"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="wrapper" class="wrapper">
        <div id="tooltip" class="tooltip">
            <div class="tooltip-date">
                <span id="date"></span>
            </div>
            <div class="tooltip-humidity">
                Humidity: <span id="humidity"></span>
            </div>
            <div class="tooltip-dew-point">
                Dew point: <span id="dew-point"></span>
            </div>
        </div>
    </div>

    <script type="module" src="d3.delaunay.js"></script>
    <script src="index.js"></script>
</body>
</html>
